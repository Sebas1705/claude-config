name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity for the fixture repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Privacy terms (optional repository secret PRIVACY_TERMS, one term per line)
        if: env.PRIVACY_TERMS != ''
        shell: bash
        run: echo "$PRIVACY_TERMS" > .privacy-terms
      - run: npm test
